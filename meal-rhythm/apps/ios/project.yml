name: MealRhythm
options:
  bundleIdPrefix: com.mealrhythm
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: '7.0.0'
targets:
  MealRhythm:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealrhythm.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: MealRhythm.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
  MealRhythmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MealRhythm
    settings:
      GENERATE_INFOPLIST_FILE: YES
  MealRhythmUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MealRhythm
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  MealRhythm:
    build:
      targets:
        MealRhythm: all
    test:
      targets: [MealRhythmTests, MealRhythmUITests]
      gatherCoverageData: true
